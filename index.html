const waLink = (phone) => {
  const digits = phone.replace(/\D/g, "");
  const intl = digits.startsWith("0") ? "62" + digits.slice(1) : digits;
  return `https://wa.me/${intl}`;
};

function WaButton({ phone, stop = false }) {
  return (
    <a
      href={waLink(phone)}
      target="_blank"
      rel="noopener noreferrer"
      onClick={(e) => stop && e.stopPropagation()}
      title="Chat via WhatsApp"
      className="inline-flex items-center justify-center w-5 h-5 rounded-full shrink-0"
      style={{ background: "#25D366" }}
    >
      <MessageCircle size={12} color="#fff" strokeWidth={2.5} />
    </a>
  );
}

// ---------- Modal ----------
function Modal({ open, onClose, title, children }) {

  return (

      style={{ background: "rgba(32,48,42,0.45)" }}

  return (
    <div
      className="fixed bottom-5 right-5 z-50 flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg"

// ---------- Notification bell ----------
function NotifBell({ role, pendingCount, strukturForRole, asetForRole, onGoToApprovals, onGoToStruktur, onGoToAset }) {
  const [open, setOpen] = useState(false);

  const items = [];
  if (role === "ketua") {
    if (pendingCount > 0) items.push({ text: `${pendingCount} pengajuan (IPL/Dana/Peminjaman/Warga) menunggu persetujuan akhir Anda`, action: onGoToApprovals });
    if (strukturForRole > 0) items.push({ text: `${strukturForRole} usulan perubahan Struktur Organisasi menunggu Anda`, action: onGoToStruktur });
    if (asetForRole > 0) items.push({ text: `${asetForRole} usulan penambahan/perubahan Aset menunggu Anda`, action: onGoToAset });
    if (items.length === 0) items.push({ text: "Semua pengajuan sudah diproses", action: null });
  } else if (role === "bendahara") {
    items.push(pendingCount > 0
      ? { text: `${pendingCount} bukti bayar/pengajuan dana menunggu verifikasi`, action: onGoToApprovals }
      : { text: "Tidak ada verifikasi tertunda", action: null });
  } else if (role === "admin") {
    items.push({ text: "2 laporan keluhan warga perlu ditriase", action: null });
  } else if (role === "warga") {
    items.push({ text: "Tagihan IPL Juli jatuh tempo 10 hari lagi", action: null });
  } else if (role === "satpam") {
    items.push({ text: "Jadwal shift minggu ini telah diperbarui", action: null });
  }

  const count = role === "ketua"
    ? pendingCount + strukturForRole + asetForRole
    : (role === "bendahara" ? pendingCount : items.length);

  return (
    <div className="relative">
      <button onClick={() => setOpen((o) => !o)} className="relative p-2" style={{ color: C.sand }}>
        <Bell size={18} />
        {count > 0 && (
          <span
            className="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full text-[10px] font-bold flex items-center justify-center"
            style={{ background: C.terracotta, color: C.white }}
          >
            {count}
          </span>
        )}
      </button>
      {open && (
        <div
          className="absolute right-0 mt-2 w-72 rounded-lg shadow-lg z-40 overflow-hidden"
          style={{ background: C.white, border: `1px solid ${C.line}` }}
        >
          <div className="px-3 py-2 text-xs font-semibold" style={{ background: C.paperDark, color: C.ink }}>
            Notifikasi
          </div>
          {items.map((it, i) => (
            <div
              key={i}
              onClick={() => { if (it.action) { it.action(); setOpen(false); } }}
              className="px-3 py-2.5 text-xs"
              style={{ color: C.ink, borderTop: i > 0 ? `1px solid ${C.line}` : "none", cursor: it.action ? "pointer" : "default" }}
            >
              {it.text}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function IplView({ role, showToast }) {
  const [rows, setRows] = useState(iplData);
  const [uploadOpen, setUploadOpen] = useState(false);
  const [uploadFile, setUploadFile] = useState(null);
  const [reviewIdx, setReviewIdx] = useState(null);
  const myRow = rows[5];
  const reviewRow = reviewIdx !== null ? rows[reviewIdx] : null;

  const handleUploadFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setUploadFile({ name: f.name, type: f.type, url: URL.createObjectURL(f) });
  };

  const kirimBukti = () => {
    setRows((prev) => prev.map((r, idx) => (idx === 5 ? { ...r, status: "menunggu", bukti: uploadFile } : r)));
    setUploadOpen(false);
    setUploadFile(null);
    showToast("Bukti bayar terkirim untuk verifikasi Bendahara");
  };

  const verifikasi = (i, aksi) => {
    setRows((prev) =>
      prev.map((r, idx) => {
        if (idx !== i) return r;
        if (role === "bendahara") return { ...r, status: aksi === "setuju" ? "menunggu_ketua" : "belum" };
        if (role === "ketua") return { ...r, status: aksi === "setuju" ? "lunas" : "belum" };
        return r;
      })
    );
    showToast(
      role === "bendahara"
        ? aksi === "setuju" ? "Diteruskan ke Ketua RT" : "Bukti bayar ditolak"
        : aksi === "setuju" ? "Pembayaran disetujui final" : "Ditolak oleh Ketua RT"
    );
    setReviewIdx(null);
  };

  return (
    <div>
      <SectionHeading
        eyebrow="Iuran Pemeliharaan Lingkungan"
        title="Iuran IPL"
        action={
          role === "warga" && (
            <button
              onClick={() => setUploadOpen(true)}
              className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold"
              style={{ background: C.forest, color: C.white }}
            >
              <Upload size={15} /> Unggah Bukti Bayar
            </button>
          )
        }
      />

      {role === "warga" && (
        <Card style={{ padding: 18, marginBottom: 16 }}>
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <div className="text-xs" style={{ color: C.inkSoft }}>Tagihan Anda - {myRow.bulan}</div>
              <div className="text-xl font-bold" style={{ color: C.ink, fontFamily: "Georgia, serif" }}>{rupiah(myRow.nominal)}</div>
            </div>
            <StatusBadge status={myRow.status} />
          </div>
        </Card>
      )}

      <Card>
        <ArchTop />
        <div className="p-4">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ color: C.inkSoft, textAlign: "left" }}>
                <th className="pb-2 font-semibold">Blok</th>
                <th className="pb-2 font-semibold">Nama</th>
                <th className="pb-2 font-semibold">Nominal</th>
                <th className="pb-2 font-semibold">Status</th>
                {(role === "admin" || role === "bendahara" || role === "ketua") && <th className="pb-2 font-semibold">Aksi</th>}
              </tr>
            </thead>
            <tbody>
              {rows.map((d, i) => (
                <tr key={i} style={{ borderTop: `1px solid ${C.line}` }}>
                  <td className="py-2" style={{ color: C.ink }}>{d.blok}</td>
                  <td className="py-2" style={{ color: C.ink }}>{d.nama}</td>
                  <td className="py-2" style={{ color: C.ink }}>{rupiah(d.nominal)}</td>
                  <td className="py-2"><StatusBadge status={d.status} /></td>
                  {role === "admin" && (
                    <td className="py-2 text-xs italic" style={{ color: C.inkSoft }}>
                      {d.status === "menunggu" ? "Menunggu verifikasi Bendahara" : d.status === "menunggu_ketua" ? "Menunggu persetujuan Ketua RT" : "—"}

                  )}
                  {role === "bendahara" && (
                    <td className="py-2">

                      ) : (
                        <span className="text-xs" style={{ color: C.inkSoft }}>—</span>
                      )}
                    </td>
                  )}
                  {role === "ketua" && (
                    <td className="py-2">
                      {d.status === "menunggu_ketua" ? (
                        <button onClick={() => setReviewIdx(i)} className="text-xs font-semibold px-3 py-1 rounded" style={{ background: C.forest, color: C.white }}>Tinjau</button>
                      ) : (
                        <span className="text-xs" style={{ color: C.inkSoft }}>—</span>
                      )}
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      <Modal open={uploadOpen} onClose={() => setUploadOpen(false)} title="Unggah Bukti Pembayaran">
        <div className="space-y-3 text-sm">
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Bulan tagihan</label>
            <input disabled value="Juli 2026" className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, background: C.paperDark, color: C.ink }} />
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Bukti transfer</label>
            <label className="border-2 border-dashed rounded p-5 text-center text-xs flex flex-col items-center gap-1.5 cursor-pointer" style={{ borderColor: C.line, color: C.inkSoft }}>
              <Paperclip size={16} color={C.gold} />

              <input type="file" accept=".pdf,image/*" className="hidden" onChange={handleUploadFile} />
            </label>
          </div>
          <div className="text-xs p-2 rounded" style={{ background: C.goldSoft, color: "#8A6A22" }}>
            Bukti bayar akan diverifikasi Bendahara, lalu disetujui final oleh Ketua RT.
          </div>
          <button
            onClick={kirimBukti}
            className="w-full py-2 rounded font-semibold"
            style={{ background: C.forest, color: C.white }}
          >
            Kirim untuk Verifikasi
          </button>
        </div>
      </Modal>

      <Modal open={reviewIdx !== null} onClose={() => setReviewIdx(null)} title="Tinjau Pembayaran IPL">
        {reviewRow && (
          <div className="text-sm space-y-3">
            <div>
              <div className="text-xs" style={{ color: C.inkSoft }}>{reviewRow.blok} · {reviewRow.nama} · {reviewRow.bulan}</div>
              <div className="text-lg font-bold" style={{ color: C.ink, fontFamily: "Georgia, serif" }}>{rupiah(reviewRow.nominal)}</div>
            </div>
            {reviewRow.bukti ? (
              <a
                href={reviewRow.bukti.url}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 px-3 py-2 rounded text-xs font-medium"
                style={{ background: C.paperDark, color: C.ink, border: `1px solid ${C.line}` }}
              >
                {reviewRow.bukti.type?.startsWith("image/") ? <FileImage size={14} color={C.forest} /> : <FileText size={14} color={C.forest} />}
                {reviewRow.bukti.name}
                <Download size={12} color={C.inkSoft} />
              </a>
            ) : (
              <div className="text-xs italic flex items-center gap-1" style={{ color: C.inkSoft }}>
                <AlertCircle size={13} /> Tidak ada file bukti yang dilampirkan (data simulasi)
              </div>
            )}
            <div className="flex gap-2 pt-2">
              <button onClick={() => verifikasi(reviewIdx, "tolak")} className="text-xs font-semibold px-3 py-1.5 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}>Tolak</button>
              <button onClick={() => verifikasi(reviewIdx, "setuju")} className="flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded" style={{ background: C.forest, color: C.white }}>
                {role === "bendahara" ? <>Teruskan ke Ketua <ArrowRight size={12} /></> : "Setujui Final"}
              </button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

function KasView({ role, showToast, setPending }) {
  const [danaOpen, setDanaOpen] = useState(false);
  const [keperluan, setKeperluan] = useState("");
  const [nominal, setNominal] = useState("");
  const [danaFile, setDanaFile] = useState(null);
  const saldo = kasTransaksi.reduce((acc, t) => acc + (t.jenis === "masuk" ? t.nominal : -t.nominal), 2600000);

  const [filterMode, setFilterMode] = useState("semua"); // 'bulan' | 'tahun' | 'semua'
  const [filterBulan, setFilterBulan] = useState(7);
  const [filterTahun, setFilterTahun] = useState(2026);

  const filtered = kasTransaksi.filter((t) => {
    if (filterMode === "bulan") return t.bulan === filterBulan && t.tahun === filterTahun;
    if (filterMode === "tahun") return t.tahun === filterTahun;
    return true;
  });

  const downloadCsv = () => {
    const header = "Tanggal,Keterangan,Jenis,Nominal\n";
    const rows = filtered
      .map((t) => `${t.tgl},"${t.ket}",${t.jenis},${t.nominal}`)
      .join("\n");
    const label = filterMode === "bulan" ? `${BULAN_NAMA[filterBulan]}-${filterTahun}` : filterMode === "tahun" ? `Tahun-${filterTahun}` : "Semua";
    const blob = new Blob([header + rows], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Laporan-Kas-RT66-${label}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(`Laporan kas (${label}) berhasil diunduh`);
  };

  const handleDanaFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setDanaFile({ name: f.name, type: f.type, url: URL.createObjectURL(f) });
  };

  const ajukanDana = () => {
    setPending((prev) => [
      ...prev,
      {
        id: Date.now(),
        kategori: "Dana",
        stage: "bendahara",
        icon: Landmark,
        judul: `Pengajuan Dana - ${keperluan || "Tanpa keterangan"}`,
        sub: `${nominal ? rupiah(Number(nominal)) : "Rp -"} · diajukan oleh Admin`,
        lampiran: danaFile,
      },
    ]);
    setDanaOpen(false);
    setKeperluan("");
    setNominal("");
    setDanaFile(null);
    showToast("Pengajuan terkirim ke Bendahara untuk verifikasi anggaran");
  };

  return (
    <div>
      <SectionHeading
        eyebrow="Transparansi Keuangan"
        title="Kas & Anggaran RT"
        action={
          role === "admin" && (
            <button
              onClick={() => setDanaOpen(true)}
              className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold"
              style={{ background: C.forest, color: C.white }}
            >
              <Landmark size={15} /> Ajukan Pengeluaran Dana
            </button>
          )
        }
      />
      <div className="grid md:grid-cols-3 gap-4 mb-4">
        <Card style={{ padding: 18 }} className="md:col-span-1">
          <div className="text-xs" style={{ color: C.inkSoft }}>Saldo Kas Saat Ini</div>
          <div className="text-2xl font-bold mt-1" style={{ color: C.forest, fontFamily: "Georgia, serif" }}>
            {rupiah(saldo)}
          </div>
          <div className="text-xs mt-2" style={{ color: C.inkSoft }}>Diperbarui otomatis dari setiap transaksi tercatat</div>
        </Card>
        <Card style={{ padding: 18 }} className="md:col-span-2">
          <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Pemasukan vs Pengeluaran (ribuan Rp)</div>
          <ResponsiveContainer width="100%" height={140}>
            <BarChart data={kasBulanan}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.line} vertical={false} />
              <XAxis dataKey="bulan" tick={{ fontSize: 11, fill: C.inkSoft }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize: 11, fill: C.inkSoft }} axisLine={false} tickLine={false} />
              <Tooltip />
              <Bar dataKey="masuk" fill={C.forest} radius={[3, 3, 0, 0]} name="Masuk" />
              <Bar dataKey="keluar" fill={C.terracotta} radius={[3, 3, 0, 0]} name="Keluar" />
            </BarChart>
          </ResponsiveContainer>
        </Card>
      </div>

      {(role === "admin" || role === "bendahara" || role === "ketua") && (
        <Card style={{ padding: 16, marginBottom: 16, background: C.goldSoft }}>
          <div className="flex items-center gap-2 text-xs font-semibold mb-2" style={{ color: "#5C4614" }}>
            <Clock size={14} /> Pengajuan Dana Menunggu Persetujuan Ketua RT
          </div>
          <div className="text-xs" style={{ color: "#5C4614" }}>
            Perbaikan Lampu Jalan Blok C · Rp750.000 · diajukan oleh Bendahara
          </div>
        </Card>
      )}

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Unduh Rincian Kas</div>
        <div className="flex flex-wrap items-end gap-2">
          <div>
            <label className="block mb-1 text-xs font-medium" style={{ color: C.inkSoft }}>Periode</label>
            <select value={filterMode} onChange={(e) => setFilterMode(e.target.value)} className="px-3 py-2 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>
              <option value="semua">Seluruh Riwayat</option>
              <option value="bulan">Per Bulan</option>
              <option value="tahun">Per Tahun</option>
            </select>
          </div>
          {filterMode === "bulan" && (
            <div>
              <label className="block mb-1 text-xs font-medium" style={{ color: C.inkSoft }}>Bulan</label>
              <select value={filterBulan} onChange={(e) => setFilterBulan(Number(e.target.value))} className="px-3 py-2 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>
                {BULAN_NAMA.slice(1).map((b, i) => <option key={i + 1} value={i + 1}>{b}</option>)}
              </select>
            </div>
          )}
          {(filterMode === "bulan" || filterMode === "tahun") && (
            <div>
              <label className="block mb-1 text-xs font-medium" style={{ color: C.inkSoft }}>Tahun</label>
              <select value={filterTahun} onChange={(e) => setFilterTahun(Number(e.target.value))} className="px-3 py-2 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>
                {[2025, 2026].map((y) => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          )}
          <button onClick={downloadCsv} className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold" style={{ background: C.forest, color: C.white }}>
            <Download size={15} /> Unduh ({filtered.length} transaksi)
          </button>
        </div>
      </Card>

      <Card>
        <ArchTop />
        <div className="p-4">
          <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>
            Transaksi {filterMode === "semua" ? "Terbaru" : filterMode === "bulan" ? `- ${BULAN_NAMA[filterBulan]} ${filterTahun}` : `- Tahun ${filterTahun}`}
          </div>
          <div className="space-y-2">
            {filtered.length === 0 && (
              <div className="text-xs py-4 text-center" style={{ color: C.inkSoft }}>Tidak ada transaksi pada periode ini.</div>
            )}
            {filtered.map((t, i) => (
              <div key={i} className="flex items-center justify-between py-2" style={{ borderBottom: i < filtered.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <div>
                  <div className="text-sm" style={{ color: C.ink }}>{t.ket}</div>
                  <div className="text-xs" style={{ color: C.inkSoft }}>{t.tgl}</div>
                </div>
                <div className="flex items-center gap-1 text-sm font-semibold" style={{ color: t.jenis === "masuk" ? C.forest : C.terracotta }}>
                  {t.jenis === "masuk" ? <ArrowUpRight size={15} /> : <ArrowDownRight size={15} />}
                  {rupiah(t.nominal)}
                </div>
              </div>
            ))}
          </div>
        </div>
      </Card>

      <Modal open={danaOpen} onClose={() => setDanaOpen(false)} title="Ajukan Pengeluaran Dana">
        <div className="space-y-3 text-sm">
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Keperluan</label>
            <input value={keperluan} onChange={(e) => setKeperluan(e.target.value)} placeholder="mis. Perbaikan pagar taman" className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }} />
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Estimasi nominal (Rp)</label>
            <input value={nominal} onChange={(e) => setNominal(e.target.value)} placeholder="mis. 500000" className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }} />
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Lampiran (proposal / foto kondisi / RAB)</label>
            <label className="border-2 border-dashed rounded p-4 text-center text-xs flex flex-col items-center gap-1.5 cursor-pointer" style={{ borderColor: C.line, color: C.inkSoft }}>
              <Paperclip size={16} color={C.gold} />
              {danaFile ? <span style={{ color: C.ink }} className="font-medium">{danaFile.name}</span> : <span>PDF proposal atau foto pendukung</span>}
              <input type="file" accept=".pdf,image/*" className="hidden" onChange={handleDanaFile} />
            </label>
          </div>
          <div className="text-xs p-2 rounded" style={{ background: C.goldSoft, color: "#8A6A22" }}>
            Pengajuan akan diverifikasi Bendahara terlebih dahulu, lalu diteruskan ke Ketua RT untuk persetujuan akhir sebelum dana dicairkan.
          </div>
          <button onClick={ajukanDana} className="w-full py-2 rounded font-semibold" style={{ background: C.forest, color: C.white }}>
            Kirim Pengajuan
          </button>
        </div>
      </Modal>
    </div>
  );
}

function AsetView({ role, showToast, usulan, setUsulan }) {
  const [items, setItems] = useState(asetAwal);
  const [pinjamTarget, setPinjamTarget] = useState(null);
  const [keperluan, setKeperluan] = useState("");
  const [tglPinjam, setTglPinjam] = useState("");
  const [tglKembali, setTglKembali] = useState("");

  const [modalMode, setModalMode] = useState(null); // 'tambah' | 'ubah' | 'hapus'
  const [target, setTarget] = useState(null);
  const [form, setForm] = useState({ nama: "", kategori: "", jumlah: 1, kondisi: "baik", lokasi: "", foto: null });

  const ajukan = () => {
    setItems((prev) =>
      prev.map((a) =>
        a.id === pinjamTarget.id
          ? { ...a, status: "dipinjam", peminjam: "Manto Wijaya", blok: "C-02", keperluan, tglPinjam, tglKembali }
          : a
      )
    );
    setPinjamTarget(null);
    setKeperluan("");
    setTglPinjam("");
    setTglKembali("");
    showToast("Pengajuan pinjam terkirim, menunggu persetujuan Ketua RT");
  };

  const openTambah = () => { setForm({ nama: "", kategori: "", jumlah: 1, kondisi: "baik", lokasi: "", foto: null }); setModalMode("tambah"); };
  const openUbah = (a) => { setTarget(a); setForm({ nama: a.nama, kategori: a.kategori, jumlah: a.jumlah, kondisi: a.kondisi, lokasi: a.lokasi || "", foto: a.foto || null }); setModalMode("ubah"); };
  const openHapus = (a) => { setTarget(a); setModalMode("hapus"); };

  const handleFoto = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setForm((prev) => ({ ...prev, foto: URL.createObjectURL(f) }));
  };

  const kirimUsulan = () => {
    const base = { id: Date.now(), diajukanOleh: "Admin", stage: "menunggu_ketua" };
    if (modalMode === "tambah") setUsulan((prev) => [...prev, { ...base, tipe: "tambah", data: { ...form } }]);
    if (modalMode === "ubah") setUsulan((prev) => [...prev, { ...base, tipe: "ubah", targetId: target.id, before: target, data: { ...form } }]);
    if (modalMode === "hapus") setUsulan((prev) => [...prev, { ...base, tipe: "hapus", targetId: target.id, before: target }]);
    setModalMode(null);
    setTarget(null);
    showToast("Usulan aset terkirim, menunggu persetujuan Ketua RT");
  };

  const putuskan = (u, aksi) => {
    if (aksi === "setuju") {
      if (u.tipe === "tambah") setItems((prev) => [...prev, { id: Date.now(), status: "tersedia", ...u.data }]);
      if (u.tipe === "ubah") setItems((prev) => prev.map((a) => (a.id === u.targetId ? { ...a, ...u.data } : a)));
      if (u.tipe === "hapus") setItems((prev) => prev.filter((a) => a.id !== u.targetId));
      showToast("Usulan disetujui, data aset diperbarui");
    } else {
      showToast("Usulan ditolak Ketua RT");
    }
    setUsulan((prev) => prev.filter((x) => x.id !== u.id));
  };

  const describe = (u) => {
    if (u.tipe === "tambah") return `Tambah aset baru: ${u.data.nama} (${u.data.jumlah} unit)`;
    if (u.tipe === "ubah") return `Ubah data: ${u.before.nama} → ${u.data.nama}`;
    return `Hapus dari inventaris: ${u.before.nama}`;
  };

  const myUsulan = usulan.filter((u) => u.stage === "menunggu_ketua");
  const canPropose = role === "admin";
  const canApprove = role === "ketua";

  return (
    <div>
      <SectionHeading
        eyebrow="Inventaris Bersama"
        title="Data Aset RT"
        action={
          canPropose && (
            <button onClick={openTambah} className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold" style={{ background: C.forest, color: C.white }}>
              <Plus size={15} /> Tambah Aset
            </button>
          )
        }
      />

      {(canPropose || canApprove) && myUsulan.length > 0 && (
        <Card style={{ padding: 16, marginBottom: 16, background: C.goldSoft }}>
          <div className="text-xs font-semibold mb-2 flex items-center gap-2" style={{ color: "#5C4614" }}>
            <ClipboardCheck size={14} /> {canApprove ? "Usulan Aset Menunggu Keputusan Anda" : "Usulan Anda Menunggu Persetujuan Ketua RT"}
          </div>
          <div className="space-y-2">
            {myUsulan.map((u) => (
              <div key={u.id} className="flex items-center justify-between gap-3 flex-wrap text-xs" style={{ color: "#5C4614" }}>
                <div className="flex items-center gap-2">
                  {u.data?.foto && <img src={u.data.foto} alt="" className="w-8 h-8 rounded object-cover" />}
                  <span>{describe(u)}</span>
                </div>
                {canApprove ? (
                  <div className="flex gap-1.5">
                    <button onClick={() => putuskan(u, "tolak")} className="font-semibold px-2.5 py-1 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}>Tolak</button>
                    <button onClick={() => putuskan(u, "setuju")} className="font-semibold px-2.5 py-1 rounded" style={{ background: C.forest, color: C.white }}>Setujui</button>

                  <span className="italic">Menunggu Ketua RT</span>

            ))}

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {items.map((a) => (
          <Card key={a.id} style={{ padding: 0, overflow: "hidden" }}>

function StrukturView({ role, showToast, list, setList, usulan, setUsulan }) {
  const [modalMode, setModalMode] = useState(null); // 'tambah' | 'ubah' | 'hapus'
  const [target, setTarget] = useState(null);
  const [form, setForm] = useState({ nama: "", jabatan: "" });
  const canPropose = role === "admin";
  const canApprove = role === "ketua";
  const myUsulan = usulan.filter((u) => u.stage === "menunggu_ketua");

  const openTambah = () => { setForm({ nama: "", jabatan: "" }); setModalMode("tambah"); };
  const openUbah = (s) => { setTarget(s); setForm({ nama: s.nama, jabatan: s.jabatan }); setModalMode("ubah"); };
  const openHapus = (s) => { setTarget(s); setModalMode("hapus"); };

  const kirimUsulan = () => {
    const base = { id: Date.now(), diajukanOleh: "Admin", stage: "menunggu_ketua" };
    if (modalMode === "tambah") setUsulan((prev) => [...prev, { ...base, tipe: "tambah", data: { ...form } }]);
    if (modalMode === "ubah") setUsulan((prev) => [...prev, { ...base, tipe: "ubah", targetId: target.id, before: target, data: { ...form } }]);
    if (modalMode === "hapus") setUsulan((prev) => [...prev, { ...base, tipe: "hapus", targetId: target.id, before: target }]);
    setModalMode(null);
    setTarget(null);
    showToast("Usulan perubahan struktur terkirim, menunggu persetujuan Ketua RT");
  };

  const putuskan = (u, aksi) => {
    if (aksi === "setuju") {
      if (u.tipe === "tambah") setList((prev) => [...prev, { id: Date.now(), ...u.data }]);
      if (u.tipe === "ubah") setList((prev) => prev.map((s) => (s.id === u.targetId ? { ...s, ...u.data } : s)));
      if (u.tipe === "hapus") setList((prev) => prev.filter((s) => s.id !== u.targetId));
      showToast("Usulan disetujui, struktur organisasi diperbarui");
    } else {
      showToast("Usulan ditolak Ketua RT");
    }
    setUsulan((prev) => prev.filter((x) => x.id !== u.id));
  };

  const describe = (u) => {
    if (u.tipe === "tambah") return `Tambah jabatan baru: ${u.data.jabatan} - ${u.data.nama}`;
    if (u.tipe === "ubah") return `Ubah data: ${u.before.nama} (${u.before.jabatan}) → ${u.data.nama} (${u.data.jabatan})`;
    return `Hapus dari struktur: ${u.before.nama} (${u.before.jabatan})`;
  };

  return (
    <div>
      <SectionHeading
        eyebrow="Kepengurusan"
        title="Struktur Organisasi RT 66"
        action={
          canPropose && (
            <button onClick={openTambah} className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold" style={{ background: C.forest, color: C.white }}>
              <Plus size={15} /> Usulkan Jabatan Baru
            </button>
          )
        }
      />

      {(canPropose || canApprove) && myUsulan.length > 0 && (
        <Card style={{ padding: 16, marginBottom: 16, background: C.goldSoft }}>
          <div className="text-xs font-semibold mb-2 flex items-center gap-2" style={{ color: "#5C4614" }}>
            <ClipboardCheck size={14} /> {canApprove ? "Usulan Menunggu Keputusan Anda" : "Usulan Anda Menunggu Persetujuan Ketua RT"}
          </div>
          <div className="space-y-2">
            {myUsulan.map((u) => (
              <div key={u.id} className="flex items-center justify-between gap-3 flex-wrap text-xs" style={{ color: "#5C4614" }}>
                <span>{describe(u)}</span>
                {canApprove ? (
                  <div className="flex gap-1.5">
                    <button onClick={() => putuskan(u, "tolak")} className="font-semibold px-2.5 py-1 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}>Tolak</button>
                    <button onClick={() => putuskan(u, "setuju")} className="font-semibold px-2.5 py-1 rounded" style={{ background: C.forest, color: C.white }}>Setujui</button>
                  </div>
                ) : (
                  <span className="italic">Menunggu Ketua RT</span>
                )}
              </div>
            ))}
          </div>
        </Card>
      )}

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {list.map((s) => (
          <Card key={s.id} style={{ padding: 16 }}>
            <div className="flex items-start justify-between">
              <div className="w-10 h-10 rounded-full flex items-center justify-center font-bold mb-3" style={{ background: C.forest, color: C.white }}>
                {s.nama.split(" ").map((w) => w[0]).slice(0, 2).join("")}
              </div>
              {canPropose && (
                <div className="flex gap-1">
                  <button onClick={() => openUbah(s)} className="p-1.5 rounded" style={{ background: C.paperDark, color: C.forest, border: `1px solid ${C.line}` }}><Pencil size={12} /></button>
                  <button onClick={() => openHapus(s)} className="p-1.5 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}><Trash2 size={12} /></button>
                </div>
              )}
            </div>
            <div className="text-sm font-semibold" style={{ color: C.ink }}>{s.nama}</div>
            <div className="text-xs mt-1" style={{ color: C.gold }}>{s.jabatan}</div>
          </Card>
        ))}
      </div>

      <Modal open={modalMode === "tambah" || modalMode === "ubah"} onClose={() => setModalMode(null)} title={modalMode === "tambah" ? "Usulkan Jabatan Baru" : "Usulkan Perubahan Data"}>
        <div className="space-y-3 text-sm">
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Nama</label>
            <input value={form.nama} onChange={(e) => setForm({ ...form, nama: e.target.value })} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }} />
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Jabatan</label>
            <input value={form.jabatan} onChange={(e) => setForm({ ...form, jabatan: e.target.value })} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }} />
          </div>
          <div className="text-xs p-2 rounded" style={{ background: C.goldSoft, color: "#8A6A22" }}>
            Perubahan baru berlaku setelah disetujui Ketua RT.
            {target?.jabatan === "Ketua RT 66" && " Ini termasuk usulan pergantian Ketua RT — persetujuan tetap dari Ketua RT yang menjabat saat ini."}

          <button onClick={kirimUsulan} className="w-full py-2 rounded font-semibold" style={{ background: C.forest, color: C.white }}>Kirim Usulan</button>

      <Modal open={modalMode === "hapus"} onClose={() => setModalMode(null)} title="Usulkan Penghapusan">

          <p style={{ color: C.ink }}>Usulkan penghapusan <strong>{target?.nama}</strong> ({target?.jabatan}) dari struktur organisasi?</p>

            Perubahan baru berlaku setelah disetujui Ketua RT.
            {target?.jabatan === "Ketua RT 66" && " Ini termasuk usulan pergantian Ketua RT — persetujuan tetap dari Ketua RT yang menjabat saat ini."}
          </div>
          <button onClick={kirimUsulan} className="w-full py-2 rounded font-semibold" style={{ background: C.terracotta, color: C.white }}>Kirim Usulan Hapus</button>
        </div>
      </Modal>
    </div>
  );
}

function StageStepper({ stage, butuhAnggaran }) {
  const full = ["diajukan", "diproses_admin", "menunggu_bendahara", "menunggu_ketua", "disetujui", "realisasi", "selesai"];
  const steps = butuhAnggaran ? full : full.filter((s) => !["menunggu_bendahara", "menunggu_ketua"].includes(s));
  if (stage === "ditolak") {
    return (
      <div className="flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}>
        <Ban size={15} /> Ditolak
      </div>
    );
  }
  const idx = steps.indexOf(stage);
  return (
    <div className="flex items-center overflow-x-auto pb-1">
      {steps.map((s, i) => (
        <React.Fragment key={s}>
          <div className="flex flex-col items-center shrink-0" style={{ minWidth: 74 }}>
            <div
              className="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold"
              style={{
                background: i <= idx ? C.forest : C.paperDark,
                color: i <= idx ? C.white : C.inkSoft,
                border: `1px solid ${i <= idx ? C.forest : C.line}`,
              }}
            >
              {i < idx ? <Check size={12} /> : i + 1}
            </div>
            <div className="text-[10px] text-center mt-1 leading-tight" style={{ color: i <= idx ? C.ink : C.inkSoft }}>
              {STAGE_META[s].label}
            </div>
          </div>
          {i < steps.length - 1 && (
            <div className="h-0.5 w-6 shrink-0" style={{ background: i < idx ? C.forest : C.line }} />
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

function LayananPublikView({ role, showToast, list, setList }) {
  const [openId, setOpenId] = useState(null);
  const [ajukanOpen, setAjukanOpen] = useState(false);
  const [form, setForm] = useState({ kategori: "Infrastruktur", judul: "", deskripsi: "" });
  const [file, setFile] = useState(null);
  const open = list.find((k) => k.id === openId);

  const update = (id, patch) => {
    setList((prev) => prev.map((k) => (k.id === id ? { ...k, ...patch } : k)));
  };

  const handleFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setFile({ name: f.name, type: f.type, size: f.size, url: URL.createObjectURL(f) });
  };

  const kirimKeluhan = () => {
    const nomor = 100 + list.length;
    setList((prev) => [
      { id: Date.now(), tiket: `RT66/PGD/2026/${nomor}`, kategori: form.kategori, judul: form.judul || "Keluhan warga", pelapor: "Anda", blok: "C-02", tanggal: "05 Jul 2026", deskripsi: form.deskripsi, butuhAnggaran: false, stage: "diajukan", lampiran: file },
      ...prev,
    ]);
    setAjukanOpen(false);
    setForm({ kategori: "Infrastruktur", judul: "", deskripsi: "" });
    setFile(null);
    showToast("Keluhan terkirim, nomor tiket telah diberikan");
  };

  const adminAksi = (aksi) => {
    if (aksi === "anggaran") { update(open.id, { stage: "menunggu_bendahara", butuhAnggaran: true }); showToast("Diteruskan ke Bendahara untuk verifikasi anggaran"); }
    if (aksi === "setujui") { update(open.id, { stage: "disetujui" }); showToast("Disetujui, siap direalisasikan"); }
    if (aksi === "tolak") { update(open.id, { stage: "ditolak" }); showToast("Keluhan ditolak"); }
    if (aksi === "realisasi") { update(open.id, { stage: "realisasi" }); showToast("Status diubah menjadi dalam realisasi"); }
    if (aksi === "selesai") { update(open.id, { stage: "selesai" }); showToast("Ditandai selesai"); }
    setOpenId(null);

  const bendaharaAksi = (aksi) => {
    update(open.id, { stage: aksi === "teruskan" ? "menunggu_ketua" : "ditolak" });

                  {k.lampiran && (
                    <span className="flex items-center gap-1" style={{ color: C.gold }}>
                      <Paperclip size={11} /> lampiran

              <span className="text-xs font-semibold px-2.5 py-1 rounded shrink-0" style={{ background: C.paperDark, color: STAGE_META[k.stage].color }}>

            {open.lampiran && (

            {role === "admin" && (open.stage === "diajukan" || open.stage === "diproses_admin") && (

function PersetujuanView({ role, pending, setPending, showToast }) {
  const [filter, setFilter] = useState("Semua");
  const stageItems = pending.filter((p) => p.stage === role);
  const kategoriList = ["Semua", ...Array.from(new Set(stageItems.map((p) => p.kategori)))];
  const filtered = filter === "Semua" ? stageItems : stageItems.filter((p) => p.kategori === filter);

  const handle = (id, aksi) => {
    const item = pending.find((p) => p.id === id);
    if (role === "bendahara") {
      if (aksi === "setuju") {
        setPending((prev) => prev.map((p) => (p.id === id ? { ...p, stage: "ketua" } : p)));
        showToast(`Diteruskan ke Ketua RT: ${item.judul}`);
      } else {
        setPending((prev) => prev.filter((p) => p.id !== id));
        showToast(`Ditolak oleh Bendahara: ${item.judul}`);
      }
    } else {
      setPending((prev) => prev.filter((p) => p.id !== id));
      showToast(`${aksi === "setuju" ? "Disetujui final" : "Ditolak"} oleh Ketua RT: ${item.judul}`);
    }
  };

  return (
    <div>
      <SectionHeading
        eyebrow={role === "bendahara" ? "Verifikasi Keuangan" : "Persetujuan Akhir"}
        title="Pusat Persetujuan"
        action={
          <span className="text-xs px-3 py-1.5 rounded font-semibold" style={{ background: C.goldSoft, color: "#8A6A22" }}>
            {stageItems.length} menunggu Anda
          </span>
        }
      />
      <div className="text-xs p-2 rounded mb-4" style={{ background: C.paperDark, color: C.inkSoft }}>
        {role === "bendahara"
          ? "Anda memverifikasi kelayakan & bukti keuangan. Setelah disetujui, pengajuan diteruskan ke Ketua RT untuk keputusan akhir."
          : "Anda memberi keputusan akhir. Pengajuan finansial sudah melalui verifikasi Bendahara sebelum sampai di sini."}
      </div>
      <div className="flex gap-2 mb-4 flex-wrap">
        {kategoriList.map((k) => (
          <button
            key={k}
            onClick={() => setFilter(k)}
            className="px-3 py-1.5 rounded text-xs font-semibold"
            style={{
              background: filter === k ? C.forest : C.paperDark,
              color: filter === k ? C.white : C.ink,
              border: `1px solid ${filter === k ? C.forest : C.line}`,
            }}
          >
            {k}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Card style={{ padding: 32 }}>
          <div className="text-center text-sm" style={{ color: C.inkSoft }}>
            <CheckCircle2 size={28} className="mx-auto mb-2" color={C.forest} />
            Tidak ada pengajuan menunggu di kategori ini.
          </div>
        </Card>
      ) : (
        <div className="space-y-3">
          {filtered.map((p) => (
            <Card key={p.id} style={{ padding: 16 }}>
              <div className="flex items-start justify-between gap-3 flex-wrap">
                <div className="flex gap-3">
                  <div className="w-9 h-9 rounded flex items-center justify-center shrink-0" style={{ background: C.paperDark }}>
                    <p.icon size={16} color={C.forest} />
                  </div>
                  <div>
                    <div className="text-xs font-semibold uppercase tracking-wide mb-0.5" style={{ color: C.gold }}>{p.kategori}</div>
                    <div className="text-sm font-semibold" style={{ color: C.ink }}>{p.judul}</div>
                    <div className="text-xs mt-0.5" style={{ color: C.inkSoft }}>{p.sub}</div>
                    {p.lampiran ? (
                      <a
                        href={p.lampiran.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        onClick={(e) => e.stopPropagation()}
                        className="inline-flex items-center gap-1.5 mt-1.5 px-2 py-1 rounded text-xs font-medium"
                        style={{ background: C.paperDark, color: C.ink, border: `1px solid ${C.line}` }}
                      >
                        {p.lampiran.type?.startsWith("image/") ? <FileImage size={12} color={C.forest} /> : <FileText size={12} color={C.forest} />}
                        {p.lampiran.name}
                      </a>
                    ) : (
                      <div className="text-xs italic mt-1.5 flex items-center gap-1" style={{ color: C.inkSoft }}>
                        <AlertCircle size={11} /> Tidak ada lampiran
                      </div>
                    )}
                  </div>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => handle(p.id, "tolak")}
                    className="text-xs font-semibold px-3 py-1.5 rounded"
                    style={{ background: C.terracottaSoft, color: C.terracotta }}
                  >
                    Tolak
                  </button>
                  <button
                    onClick={() => handle(p.id, "setuju")}
                    className="flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded"
                    style={{ background: C.forest, color: C.white }}
                  >
                    {role === "bendahara" ? <>Teruskan <ArrowRight size={12} /></> : "Setujui Final"}
                  </button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

    setAjukanOpen(false);
    setForm({ jenis: "Surat Domisili", keterangan: "" });
    showToast("Pengajuan surat terkirim, nomor tiket telah diberikan");
  };

  const adminAksi = (aksi) => {
    if (aksi === "teruskan") { update(open.id, { stage: "menunggu_ketua" }); showToast("Diteruskan ke Ketua RT untuk tanda tangan"); }
    if (aksi === "tolak") { update(open.id, { stage: "ditolak" }); showToast("Pengajuan surat ditolak"); }
    setOpenId(null);
  };

  const ketuaAksi = (aksi) => {
    update(open.id, { stage: aksi === "setuju" ? "selesai" : "ditolak" });
    showToast(aksi === "setuju" ? "Ditandatangani, surat siap diambil" : "Ditolak oleh Ketua RT");
    setOpenId(null);
  };

  return (
    <div>
      <SectionHeading
        eyebrow="Surat Menyurat"
        title="Pengajuan Surat"
        action={
          role === "warga" && (
            <button onClick={() => setAjukanOpen(true)} className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold" style={{ background: C.forest, color: C.white }}>
              <Plus size={15} /> Ajukan Surat
            </button>
          )
        }
      />
      <div className="space-y-3">
        {list.map((s) => (
          <Card key={s.id} className="cursor-pointer" onClick={() => setOpenId(s.id)} style={{ padding: 16 }}>
            <div className="flex items-start justify-between gap-3 flex-wrap">
              <div>
                <div className="text-xs font-mono" style={{ color: C.inkSoft }}>{s.tiket}</div>
                <div className="text-sm font-semibold mt-0.5" style={{ color: C.ink }}>{s.jenis}</div>
                <div className="text-xs mt-1" style={{ color: C.inkSoft }}>{s.pemohon} · Blok {s.blok} · {s.tanggal}</div>
              </div>
              <span className="text-xs font-semibold px-2.5 py-1 rounded shrink-0" style={{ background: C.paperDark, color: SURAT_STAGE_META[s.stage].color }}>
                {SURAT_STAGE_META[s.stage].label}
              </span>
            </div>
          </Card>
        ))}
      </div>

      <Modal open={!!open} onClose={() => setOpenId(null)} title={open?.jenis || ""}>
        {open && (
          <div className="text-sm">
            <div className="text-xs font-mono mb-2" style={{ color: C.inkSoft }}>{open.tiket}</div>
            <SuratStepper stage={open.stage} />
            <p className="mt-4" style={{ color: C.ink }}>{open.keterangan}</p>
            <div className="text-xs mt-2" style={{ color: C.inkSoft }}>Pemohon: {open.pemohon} · Blok {open.blok}</div>

            {role === "admin" && open.stage === "diajukan" && (
              <div className="flex gap-2 mt-4">
                <button onClick={() => adminAksi("tolak")} className="text-xs font-semibold px-3 py-1.5 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}>Tolak</button>
                <button onClick={() => adminAksi("teruskan")} className="flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded" style={{ background: C.forest, color: C.white }}>Teruskan ke Ketua <ArrowRight size={12} /></button>
              </div>
            )}
            {role === "ketua" && open.stage === "menunggu_ketua" && (
              <div className="flex gap-2 mt-4">
                <button onClick={() => ketuaAksi("tolak")} className="text-xs font-semibold px-3 py-1.5 rounded" style={{ background: C.terracottaSoft, color: C.terracotta }}>Tolak</button>
                <button onClick={() => ketuaAksi("setuju")} className="text-xs font-semibold px-3 py-1.5 rounded" style={{ background: C.forest, color: C.white }}>Tandatangani & Selesaikan</button>
              </div>
            )}
          </div>
        )}
      </Modal>

      <Modal open={ajukanOpen} onClose={() => setAjukanOpen(false)} title="Ajukan Surat">
        <div className="space-y-3 text-sm">
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Jenis surat</label>
            <select value={form.jenis} onChange={(e) => setForm({ ...form, jenis: e.target.value })} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }}>
              {["Surat Domisili", "Surat Keterangan Usaha", "Surat Pengantar KTP", "Surat Keterangan Tidak Mampu", "Lainnya"].map((j) => <option key={j}>{j}</option>)}
            </select>
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Keterangan / keperluan</label>
            <textarea value={form.keterangan} onChange={(e) => setForm({ ...form, keterangan: e.target.value })} rows={3} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }} />

function MasterUserView({ role }) {
  const [users, setUsers] = useState(masterUserSeed);
  const [editing, setEditing] = useState(null); // 'new' | id | null
  const [form, setForm] = useState({ nama: "", username: "", role: "warga", status: "Aktif" });
  const [resetTarget, setResetTarget] = useState(null);
  const [tempPass, setTempPass] = useState(null);

  const roleBadge = { admin: "Admin", bendahara: "Bendahara", ketua: "Ketua RT", satpam: "Satpam", warga: "Warga" };

  const suggestUsername = (nama) =>
    nama.trim().toLowerCase().split(/\s+/).slice(0, 2).join(".");

  const handleNamaChange = (val) => {
    const cocok = dataWargaSeed.find((w) => w.nama === val);
    setForm((f) => ({
      ...f,
      nama: val,
      username: editing === "new" && !f.username.trim() ? suggestUsername(val) : f.username,
      role: editing === "new" && cocok && f.role === "warga" ? "warga" : f.role,
    }));
  };

  const openAdd = () => { setForm({ nama: "", username: "", role: "warga", status: "Aktif" }); setEditing("new"); };
  const openEdit = (u) => { setForm(u); setEditing(u.id); };
  const simpan = () => {
    if (editing === "new") {
      setUsers((prev) => [...prev, { ...form, id: Date.now() }]);
    } else {
      setUsers((prev) => prev.map((u) => (u.id === editing ? { ...form, id: editing } : u)));
    }
    setEditing(null);
  };

  const resetPassword = () => {
    const rand = Math.random().toString(36).slice(-8);
    setTempPass(rand);
  };

  return (
    <div>
      <SectionHeading
        eyebrow="Administrasi Akun"
        title="Master User"
        action={
          <button onClick={openAdd} className="flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold" style={{ background: C.forest, color: C.white }}>
            <Plus size={15} /> Tambah User
          </button>
        }
      />
      <div className="text-xs p-2 rounded mb-4" style={{ background: C.paperDark, color: C.inkSoft }}>
        Kelola akun pengguna sistem — ubah nama/username atau reset kata sandi jika ada yang lupa.
      </div>
      <Card>
        <ArchTop />
        <div className="p-4 overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ color: C.inkSoft, textAlign: "left" }}>
                <th className="pb-2 font-semibold">Nama</th>
                <th className="pb-2 font-semibold">Username</th>
                <th className="pb-2 font-semibold">Role</th>
                <th className="pb-2 font-semibold">Status</th>
                <th className="pb-2 font-semibold">Aksi</th>
              </tr>
            </thead>
            <tbody>
              {users.map((u) => (
                <tr key={u.id} style={{ borderTop: `1px solid ${C.line}` }}>
                  <td className="py-2" style={{ color: C.ink }}>{u.nama}</td>
                  <td className="py-2 font-mono text-xs" style={{ color: C.inkSoft }}>{u.username}</td>
                  <td className="py-2">
                    <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: C.paperDark, color: C.forest }}>{roleBadge[u.role]}</span>
                  </td>
                  <td className="py-2">
                    <span className="text-xs font-medium" style={{ color: u.status === "Aktif" ? C.forest : C.terracotta }}>{u.status}</span>
                  </td>
                  <td className="py-2">
                    <div className="flex gap-1.5">
                      <button onClick={() => openEdit(u)} className="flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded" style={{ background: C.paperDark, color: C.ink, border: `1px solid ${C.line}` }}>
                        <Pencil size={12} /> Ubah
                      </button>
                      <button onClick={() => { setResetTarget(u); setTempPass(null); }} className="flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded" style={{ background: C.goldSoft, color: "#8A6A22" }}>
                        <KeyRound size={12} /> Reset Sandi
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      <Modal open={!!editing} onClose={() => setEditing(null)} title={editing === "new" ? "Tambah User Baru" : "Ubah Data Pengguna"}>
        <div className="space-y-3 text-sm">
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Nama</label>
            <input
              list="daftar-nama-warga"
              value={form.nama}
              onChange={(e) => handleNamaChange(e.target.value)}
              placeholder="Ketik atau pilih dari Data Warga"
              className="w-full px-3 py-2 rounded border"
              style={{ borderColor: C.line, color: C.ink }}
            />
            <datalist id="daftar-nama-warga">
              {dataWargaSeed.map((w) => (
                <option key={w.id} value={w.nama} />
              ))}
            </datalist>
            <div className="text-[11px] mt-1" style={{ color: C.inkSoft }}>Nama otomatis muncul dari Data Warga — bisa juga diketik manual untuk non-warga (mis. satpam).</div>
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Username</label>
            <input value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }} />
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Role</label>
            <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }}>
              <option value="warga">Warga</option>
              <option value="admin">Admin</option>
              <option value="bendahara">Bendahara</option>
              <option value="ketua">Ketua RT</option>
              <option value="satpam">Satpam</option>
            </select>
          </div>
          <div>
            <label className="block mb-1 font-medium" style={{ color: C.ink }}>Status akun</label>
            <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className="w-full px-3 py-2 rounded border" style={{ borderColor: C.line, color: C.ink }}>
              <option>Aktif</option>
              <option>Nonaktif</option>
            </select>
          </div>
          {editing === "new" && (
            <div className="text-xs p-2 rounded" style={{ background: C.goldSoft, color: "#8A6A22" }}>
              Sandi awal akan dibuat otomatis dan bisa direset kapan pun lewat tombol "Reset Sandi".
            </div>
          )}
          <button onClick={simpan} className="w-full py-2 rounded font-semibold" style={{ background: C.forest, color: C.white }}>
            {editing === "new" ? "Tambah User" : "Simpan"}
          </button>
        </div>
      </Modal>

      <Modal open={!!resetTarget} onClose={() => setResetTarget(null)} title={`Reset Sandi: ${resetTarget?.nama || ""}`}>
        <div className="space-y-3 text-sm">
          {!tempPass ? (
            <>
              <p style={{ color: C.ink }}>Buat kata sandi sementara baru untuk <strong>{resetTarget?.nama}</strong> ({resetTarget?.username})?</p>
              <div className="text-xs p-2 rounded flex items-center gap-2" style={{ background: C.terracottaSoft, color: C.terracotta }}>
                <AlertCircle size={13} /> Pengguna wajib mengganti sandi ini saat login berikutnya.
              </div>
              <button onClick={resetPassword} className="w-full py-2 rounded font-semibold" style={{ background: C.forest, color: C.white }}>Buat Sandi Sementara</button>
            </>
          ) : (
            <>
              <div className="text-xs" style={{ color: C.inkSoft }}>Sandi sementara berhasil dibuat:</div>
              <div className="font-mono text-lg font-bold text-center py-3 rounded" style={{ background: C.paperDark, color: C.ink, letterSpacing: 2 }}>{tempPass}</div>
              <div className="text-xs p-2 rounded" style={{ background: C.goldSoft, color: "#8A6A22" }}>Sampaikan sandi ini ke pengguna melalui jalur pribadi (WhatsApp/tatap muka), bukan grup umum.</div>
              <button onClick={() => setResetTarget(null)} className="w-full py-2 rounded font-semibold" style={{ background: C.forest, color: C.white }}>Selesai</button>
            </>
          )}
        </div>
      </Modal>
    </div>
  );
}

            <div className="w-12 h-12 mx-auto rounded-full border-2 flex items-center justify-center font-bold text-sm mb-2" style={{ borderColor: C.gold, color: C.gold }}>66</div>
            <div className="font-bold text-lg" style={{ color: C.ink }}>Portal Warga RT 66 / RW 14</div>
            <div className="text-xs" style={{ color: C.inkSoft }}>Buana Taman Sari Raya 2, Kondang Jaya</div>
          </div>

          <h2 className="text-2xl font-bold mb-1" style={{ color: C.ink, fontFamily: "Georgia, serif" }}>Selamat Datang</h2>
          <p className="text-sm mb-6" style={{ color: C.inkSoft }}>Masuk untuk mengakses layanan warga RT 66.</p>

          <div className="space-y-4 text-sm">
            <div>
              <label className="block mb-1.5 font-medium" style={{ color: C.ink }}>Username</label>
              <input
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                placeholder="mis. sutrisno.hadi"
                className="w-full px-3.5 py-2.5 rounded-lg border"
                style={{ borderColor: C.line, color: C.ink }}
              />
            </div>
            <div>
              <label className="block mb-1.5 font-medium" style={{ color: C.ink }}>Kata Sandi</label>
              <input type="password" placeholder="••••••••" className="w-full px-3.5 py-2.5 rounded-lg border" style={{ borderColor: C.line, color: C.ink }} />
            </div>
            <label className="flex items-center gap-2 text-xs" style={{ color: C.inkSoft }}>
              <input type="checkbox" /> Ingat saya
            </label>
            <button onClick={onMasuk} className="w-full py-2.5 rounded-lg font-semibold text-white" style={{ background: C.forest }}>
              Masuk
            </button>
          </div>

          <div className="mt-8 pt-6 border-t text-center text-xs" style={{ borderColor: C.sand, color: "#8A9088" }}>
            Lupa kata sandi? Hubungi Admin atau Ketua RT untuk direset.
          </div>
          <div className="mt-3 text-center text-xs">
            <button onClick={onKembali} className="font-medium" style={{ color: C.forest }}>← Kembali ke Beranda Publik</button>
          </div>
          <div className="mt-4 text-center text-xs italic" style={{ color: C.inkSoft }}>
            (Demo: klik "Masuk" langsung tanpa perlu isi field di atas)
          </div>
        </div>
      </div>
    </div>
  );
}

export default function App() {
  const [stage, setStage] = useState("public"); // 'public' | 'login' | 'app'
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [role, setRole] = useState("warga");
  const [active, setActive] = useState("dashboard");
  const [navOpen, setNavOpen] = useState(false);
  const [pending, setPending] = useState(approvalSeed);
  const [keluhan, setKeluhan] = useState(keluhanSeed);
  const [surat, setSurat] = useState(suratSeed);
  const [struktur, setStruktur] = useState(strukturOrg);
  const [strukturUsulan, setStrukturUsulan] = useState(strukturUsulanSeed);
  const [asetUsulan, setAsetUsulan] = useState(asetUsulanSeed);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const showToast = (msg) => {
    setToast(msg);
    window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToast(null), 2600);
  };

  const visibleNav = NAV.filter((n) => n.roles.includes(role));
  const myPendingCount = pending.filter((p) => p.stage === role).length;

  // Items needing this role's action right now, for badges & dashboard nudges
  const keluhanForRole = keluhan.filter((k) =>
    role === "admin" ? ["diajukan", "diproses_admin"].includes(k.stage) : role === "ketua" ? k.stage === "menunggu_ketua" : false
  ).length;
  const suratForRole = surat.filter((s) =>
    role === "admin" ? s.stage === "diajukan" : role === "ketua" ? s.stage === "menunggu_ketua" : false
  ).length;
  const strukturForRole = role === "ketua" ? strukturUsulan.filter((u) => u.stage === "menunggu_ketua").length : 0;
  const asetForRole = role === "ketua" ? asetUsulan.filter((u) => u.stage === "menunggu_ketua").length : 0;

  const renderView = () => {
    switch (active) {
      case "dashboard": return <DashboardView role={role} pendingCount={myPendingCount} keluhanForRole={keluhanForRole} suratForRole={suratForRole} strukturForRole={strukturForRole} asetForRole={asetForRole} onNavigate={() => setActive("persetujuan")} onNavigateLayanan={() => setActive("layanan")} onNavigateSurat={() => setActive("surat")} onNavigateStruktur={() => setActive("struktur")} onNavigateAset={() => setActive("aset")} />;
      case "persetujuan": return <PersetujuanView role={role} pending={pending} setPending={setPending} showToast={showToast} />;
      case "layanan": return <LayananPublikView role={role} showToast={showToast} list={keluhan} setList={setKeluhan} />;
      case "surat": return <SuratView role={role} showToast={showToast} list={surat} setList={setSurat} />;
      case "warga": return <DataWargaView role={role} />;
      case "master": return <MasterUserView role={role} />;
      case "ipl": return <IplView role={role} showToast={showToast} />;
      case "kas": return <KasView role={role} showToast={showToast} setPending={setPending} />;
      case "aset": return <AsetView role={role} showToast={showToast} usulan={asetUsulan} setUsulan={setAsetUsulan} />;
      case "denah": return <DenahView role={role} />;
      case "struktur": return <StrukturView role={role} showToast={showToast} list={struktur} setList={setStruktur} usulan={strukturUsulan} setUsulan={setStrukturUsulan} />;
      case "memo": return <MemoView role={role} />;
      case "event": return <EventView role={role} showToast={showToast} />;
      case "berita": return <BeritaView />;
      case "satpam": return <SatpamView role={role} showToast={showToast} />;
      default: return <DashboardView role={role} pendingCount={myPendingCount} keluhanForRole={keluhanForRole} suratForRole={suratForRole} strukturForRole={strukturForRole} asetForRole={asetForRole} onNavigate={() => setActive("persetujuan")} onNavigateLayanan={() => setActive("layanan")} onNavigateSurat={() => setActive("surat")} onNavigateStruktur={() => setActive("struktur")} onNavigateAset={() => setActive("aset")} />;
    }
  };

  if (stage === "public") {
    return <PublicSite onMasuk={() => setStage("login")} />;
  }
  if (stage === "login") {
    return <LoginScreen onMasuk={() => setStage("app")} onKembali={() => setStage("public")} />;
  }

  return (
    <div style={{ background: C.paper, minHeight: "100vh", fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <style>{`
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .view-transition { animation: fadeSlide 0.22s ease-out; }
      `}</style>

      {/* Top bar */}
      <div className="flex items-center justify-between px-4 py-3 sticky top-0 z-30" style={{ background: C.forestDark, borderBottom: `3px solid ${C.gold}` }}>
        <div className="flex items-center gap-3">
          <button className="lg:hidden" onClick={() => setNavOpen(!navOpen)} style={{ color: C.white }}>
            {navOpen ? <X size={22} /> : <Menu size={22} />}
          </button>
          <button
            className="hidden lg:inline-flex p-1.5 rounded hover:bg-white/10"
            onClick={() => setSidebarCollapsed((c) => !c)}
            title="Tampilkan/sembunyikan menu"
            style={{ color: C.white }}
          >
            <Menu size={20} />
          </button>
          <GapuraMark size={36} />
          <div>
            <div className="text-sm font-bold leading-tight" style={{ color: C.white, fontFamily: "Georgia, serif" }}>
              Portal Warga RT 66 / RW 14
            </div>
            <div className="text-[11px] leading-tight" style={{ color: C.goldSoft }}>
              Buana Taman Sari Raya 2 · Kondang Jaya, Karawang
            </div>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <NotifBell
            role={role}
            pendingCount={myPendingCount}
            strukturForRole={strukturForRole}
            asetForRole={asetForRole}
            onGoToApprovals={() => setActive("persetujuan")}
            onGoToStruktur={() => setActive("struktur")}
            onGoToAset={() => setActive("aset")}
          />
          <span className="text-xs hidden sm:inline" style={{ color: C.sand }}>Lihat sebagai:</span>
          <div className="flex rounded overflow-hidden" style={{ border: `1px solid ${C.forestLight}` }}>
            {["warga", "admin", "bendahara", "ketua", "satpam"].map((r) => (
              <button
                key={r}
                onClick={() => { setRole(r); setActive("dashboard"); }}
                className="px-2.5 py-1.5 text-[11px] font-semibold capitalize"
                style={{
                  background: role === r ? C.gold : "transparent",
                  color: role === r ? C.forestDark : C.sand,
                }}
              >
                {r}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="flex">
        {/* Sidebar */}
        <div
          className={`${navOpen ? "block" : "hidden"} ${sidebarCollapsed ? "lg:hidden" : "lg:block"} w-60 shrink-0 min-h-[calc(100vh-58px)] p-3`}
          style={{ background: C.forest, borderRight: `1px solid ${C.forestDark}` }}
        >
          {visibleNav.map((n) => (
            <button
              key={n.key}
              onClick={() => { setActive(n.key); setNavOpen(false); }}
              className="w-full flex items-center justify-between px-3 py-2.5 rounded text-sm font-medium mb-1"
              style={{
                background: active === n.key ? C.forestDark : "transparent",
                color: active === n.key ? C.gold : C.sand,
              }}
            >
              <span className="flex items-center gap-3">
                <n.icon size={16} />
                {n.label}
              </span>
              {n.key === "persetujuan" && myPendingCount > 0 && (
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: C.terracotta, color: C.white }}>
                  {myPendingCount}
                </span>
              )}
              {n.key === "layanan" && keluhanForRole > 0 && (
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: C.terracotta, color: C.white }}>
                  {keluhanForRole}
                </span>
              )}
              {n.key === "surat" && suratForRole > 0 && (
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: C.terracotta, color: C.white }}>
                  {suratForRole}
                </span>
              )}
              {n.key === "struktur" && strukturForRole > 0 && (
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: C.terracotta, color: C.white }}>
                  {strukturForRole}
                </span>
              )}
              {n.key === "aset" && asetForRole > 0 && (
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: C.terracotta, color: C.white }}>
                  {asetForRole}
                </span>
              )}
            </button>
          ))}
        </div>

        {/* Content */}
        <div key={active} className="view-transition flex-1 p-4 sm:p-6 max-w-5xl">{renderView()}</div>
      </div>

      <Toast toast={toast} />
    </div>
  );
}

document.getElementById('loading').remove();
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
